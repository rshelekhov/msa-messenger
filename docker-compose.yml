version: "3.8"

services:
  sso:
    image: rshelekhov/grpc-sso:latest
    ports:
      - "44044:44044" # gRPC port
    environment:
      - CONFIG_PATH=/src/config/.env
    volumes:
      - ./sso/config:/src/config

  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=chat_db
      - REDIS_URL=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongodb
      - redis
      - rabbitmq

  subscriber:
    build:
      context: .
      dockerfile: subscriber/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - REDIS_URL=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - redis
      - rabbitmq

  notification:
    build:
      context: .
      dockerfile: notification/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=notification_db
      - REDIS_URL=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongodb
      - redis
      - rabbitmq

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/src/config/.env
    depends_on:
      - sso
      - chat
      - subscriber
      - notification
    volumes:
      - ./gateway/config:/src/config
    command: >
      sh -c "
        if [ ! -f /src/config/.env ]; then
          cp /src/config/.env.example /src/config/.env
        fi
        make ./app
      "
  mongodb:
    image: mongo:5
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:
