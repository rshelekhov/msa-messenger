apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: messenger
  labels:
    app: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: msa-messenger/chat:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          volumeMounts:
            - name: chat-config
              mountPath: /config
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8083
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: chat-config
          configMap:
            name: chat-config
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
