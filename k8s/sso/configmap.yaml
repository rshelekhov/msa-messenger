apiVersion: v1
kind: ConfigMap
metadata:
  name: sso-config
  namespace: messenger
  labels:
    app: sso-service
data:
  config.yaml: |
    # SSO Service Configuration for Kubernetes

    App:
      ID: msa-messenger-sso-app-id
      Env: production
      ServiceName: msa-messenger-sso
      ServiceVersion: 1.0.0
      EnableMetrics: true
      OTLPEndpoint: localhost:4317

    GRPCServer:
      Host: 0.0.0.0
      Port: 44044
      Timeout: 30s
      RetriesCount: 3

    Storage:
      Type: postgres

    Database:
      Postgres:
        ConnURL: postgres://your_username:your_password@your_postgres_host:5432/sso_db?sslmode=disable
        ConnPoolSize: 10
        ReadTimeout: 5s
        WriteTimeout: 5s
        IdleTimeout: 60s
        DialTimeout: 10s

    Redis:
      Host: redis
      Port: 6379
      Password: ""
      DB: 0
      PoolSize: 10
      MinIdleConns: 5
      SessionTTL: 168h
      RevokedTokenTTL: 24h

    JWT:
      Issuer: sso
      SigningMethod: RS256
      JWKSURL: http://sso-service:44044/.well-known/jwks.json
      JWKSTTL: 24h
      AccessTokenTTL: 15m
      RefreshTokenTTL: 720h
      RefreshTokenCookieDomain: localhost
      RefreshTokenCookiePath: /

    PasswordHash:
      Type: argon2
      SaltLength: 24
      Pepper: red-hot-chili-peppers
      Argon2:
        Time: 2
        Memory: 24576
        Parallelism: 2
        KeyLength: 24

    KeyStorage:
      Type: local
      LocalPath: ./certs

    EmailService:
      Type: mock
      TemplatesPath: ./static/email_templates

    Verification:
      TokenExpiryTime: 24h
