apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: messenger
data:
  # App environment
  APP_ENV: "local"

  # HTTP Server
  HTTP_SERVER_ADDRESS: "0.0.0.0:8080"
  HTTP_SERVER_TIMEOUT: "30s"
  HTTP_SERVER_IDLE_TIMEOUT: "60s"

  # CORS
  CORS_ALLOWED_ORIGINS: "http://localhost:8080"
  CORS_ALLOWED_METHODS: "GET, POST, PATCH, DELETE, OPTIONS"
  CORS_ALLOWED_HEADERS: "Accept, Authorization, Content-Type, X-Request-ID, Origin, X-Requested-With"
  CORS_EXPOSED_HEADERS: "X-Request-ID"
  CORS_ALLOW_CREDENTIALS: "false"
  CORS_MAX_AGE: "3600"
  CORS_DEBUG: "true"

  # Validator
  PASSWORD_REGEX: "^[A-Za-z\\d@$!%*?&]{8,}$"

  # Service URLs
  AUTH_SERVICE_URL: "http://auth-service:8081"
  USER_SERVICE_URL: "http://user-service:8082"
  CHAT_SERVICE_URL: "http://chat-service:8083"
  SUBSCRIBER_SERVICE_URL: "http://subscriber-service:8084"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8085"
