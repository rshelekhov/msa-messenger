apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: messenger
data:
  config.yaml: |
    # Gateway Configuration for Kubernetes

    App:
      ID: msa-messenger-gateway-app-id
      Env: production
      ServiceName: msa-messenger-gateway
      ServiceVersion: 1.0.0
      EnableMetrics: true
      OTLPEndpoint: localhost:4317

    HTTPServer:
      Address: 0.0.0.0:8080
      Timeout: 30s
      IdleTimeout: 60s

    CORS:
      AllowedOrigins:
        - http://localhost:8080
        - http://localhost:3000
      AllowedMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      AllowedHeaders:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
        - Origin
        - X-Requested-With
      ExposedHeaders:
        - X-Request-ID
      AllowCredentials: false
      MaxAge: 3600
      Debug: false

    Validator:
      PasswordRegex: "^[A-Za-z\\d@$!%*?&]{8,}$"

    JWT:
      JWKSEndpoint: http://sso-service:44044/.well-known/jwks.json

    Services:
      AuthService: http://sso-service:44044
      UserService: http://user-service:8082
      ChatService: http://chat-service:8083
      SubscriberService: http://subscriber-service:8084
      NotificationService: http://notification-service:8085
