apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: messenger
  labels:
    app: notification-service
data:
  config.yaml: |
    # Notification Service Configuration for Kubernetes

    App:
      ID: msa-messenger-notification-app-id
      Env: production
      ServiceName: msa-messenger-notification
      ServiceVersion: 1.0.0
      EnableMetrics: true
      OTLPEndpoint: localhost:4317

    HTTPServer:
      Address: 0.0.0.0:8085
      Timeout: 30s
      IdleTimeout: 60s

    Database:
      Type: mongodb
      MongoDB:
        Host: mongodb
        Port: 27017
        DatabaseName: notification_db
        Username: ""
        Password: ""
        ConnectTimeout: 10s
        ReadTimeout: 5s
        WriteTimeout: 5s

    MessageQueue:
      Type: rabbitmq
      RabbitMQ:
        Host: rabbitmq
        Port: 5672
        Username: guest
        Password: guest
        VirtualHost: /
        Exchange: notification_exchange
        Queue: notification_queue

    EmailService:
      Type: smtp
      SMTP:
        Host: smtp.gmail.com
        Port: 587
        Username: ""
        Password: ""
        From: noreply@messenger.com

    PushNotifications:
      Enabled: false
      FCM:
        ServerKey: ""
