apiVersion: v1
kind: ConfigMap
metadata:
  name: subscriber-config
  namespace: messenger
  labels:
    app: subscriber-service
data:
  config.yaml: |
    # Subscriber Service Configuration for Kubernetes

    App:
      ID: msa-messenger-subscriber-app-id
      Env: production
      ServiceName: msa-messenger-subscriber
      ServiceVersion: 1.0.0
      EnableMetrics: true
      OTLPEndpoint: localhost:4317

    HTTPServer:
      Address: 0.0.0.0:8084
      Timeout: 30s
      IdleTimeout: 60s

    Database:
      Type: mongodb
      MongoDB:
        Host: mongodb
        Port: 27017
        DatabaseName: subscriber_db
        Username: ""
        Password: ""
        ConnectTimeout: 10s
        ReadTimeout: 5s
        WriteTimeout: 5s

    MessageQueue:
      Type: rabbitmq
      RabbitMQ:
        Host: rabbitmq
        Port: 5672
        Username: guest
        Password: guest
        VirtualHost: /
        Exchange: subscriber_exchange
        Queue: subscriber_queue

    Subscription:
      MaxSubscriptions: 1000
      MaxChannelsPerUser: 100
