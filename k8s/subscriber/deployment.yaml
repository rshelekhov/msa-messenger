apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber-service
  namespace: messenger
  labels:
    app: subscriber-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subscriber-service
  template:
    metadata:
      labels:
        app: subscriber-service
    spec:
      containers:
        - name: subscriber-service
          image: msa-messenger/subscriber:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          volumeMounts:
            - name: subscriber-config
              mountPath: /config
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: 8084
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: subscriber-config
          configMap:
            name: subscriber-config
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
