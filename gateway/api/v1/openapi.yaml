openapi: "3.0.0"
info:
  title: API Gateway
  version: "0.1.0"

servers:
  - url: https://localhost:8080/v1
    description: Main API server

paths:
  /auth/login:
    post:
      summary: "Login"
      description: "Login to the application"
      tags:
        - "auth"
      parameters:
        - $ref: "#/components/parameters/clientType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Contains refresh_token cookies (for web clients only)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginResponseWeb"
                  - $ref: "#/components/schemas/LoginResponseMobile"
        "400":
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized if invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      summary: "Register"
      description: "Register a new user"
      tags:
        - "auth"
      parameters:
        - $ref: "#/components/parameters/clientType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Contains refresh_token cookies (for web clients only)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RegisterResponseWeb"
                  - $ref: "#/components/schemas/RegisterResponseMobile"
        "400":
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      summary: "Refresh"
      description: "Refresh the access token"
      tags:
        - "auth"
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequestMobile"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Contains refresh_token cookies (for web clients only)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RefreshTokenResponseWeb"
                  - $ref: "#/components/schemas/RefreshTokenResponseMobile"
        "400":
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      summary: "Logout"
      description: "Logout from the application"
      tags:
        - "auth"
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    get:
      summary: "Verify Email"
      description: "Verify user email address using token from email link"
      tags:
        - "auth"
      parameters:
        - $ref: "#/components/parameters/verificationToken"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
        "400":
          description: Bad Request - Invalid or missing token, or token expired and email was resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      summary: "Reset Password"
      description: "Reset user password using email"
      tags:
        - "auth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400":
          description: Bad Request - Invalid email or token expired and email was resent
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      summary: "Change Password"
      description: "Change user password using reset token from email. Token is provided as query parameter (e.g., /auth/change-password?token=TOKEN)"
      tags:
        - "auth"
      parameters:
        - $ref: "#/components/parameters/passwordResetToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          description: Bad Request - Invalid token or password
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Token expired or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      summary: "Get Own Profile"
      description: "Get own profile information"
      tags:
        - "user"
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: "Update Own Profile"
      description: "Update own profile information (name, email)"
      tags:
        - "user"
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfileRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: "Delete User"
      description: "Delete user profile"
      tags:
        - "user"
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/search:
    get:
      summary: "Search Users"
      description: "Search for users by name"
      tags:
        - "user"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/searchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friends:
    get:
      summary: "Get Friends"
      description: "Get friends list with pagination"
      tags:
        - "subscriber"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/pageToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friends/{id}:
    get:
      summary: "Get Friend"
      description: "Get a friend's profile"
      tags:
        - "subscriber"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/friendId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: "Delete Friend"
      description: "Delete a friend"
      tags:
        - "subscriber"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/friendId"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friends/{id}/invite:
    post:
      summary: "Invite Friend"
      description: "Invite a friend to the application"
      tags:
        - "subscriber"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/friendId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteFriendRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteFriendResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friend-invites/{id}/accept:
    patch:
      summary: "Accept Friend Invite"
      description: "Accept a pending friend invite"
      tags:
        - "subscriber"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/inviteId"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friend-invites/{id}/decline:
    patch:
      summary: "Decline Friend Invite"
      description: "Decline a pending friend invite"
      tags:
        - "subscriber"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/inviteId"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friend-invites:
    get:
      summary: "Get Friend Invites"
      description: "Get list of friend invites with filtering and pagination"
      tags:
        - "subscriber"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/inviteDirection"
        - $ref: "#/components/parameters/inviteStatus"
        - $ref: "#/components/parameters/pageToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitesResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chats:
    get:
      summary: "Get Chats"
      description: "Get chats"
      tags:
        - "chat"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/pageToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chats/{id}:
    post:
      summary: "Send Message"
      description: "Send a message to a chat"
      tags:
        - "chat"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: "Get Chat Messages"
      description: "Get chat messages"
      tags:
        - "chat"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/chatId"
        - $ref: "#/components/parameters/pageToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: "Delete Chat"
      description: "Delete a chat"
      tags:
        - "chat"
      security:
        - Bearer: []
      parameters:
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token in Authorization header"
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: "Error title"
        description:
          type: string
          description: "Error description"
    ValidationErrorResponse:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          description: "Error message"
        details:
          type: object
          additionalProperties:
            type: string
          description: "Field-specific validation errors. Keys are field names, values are error messages"
          example:
            email: "invalid email format"
            password: "must be at least 8 characters"
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          description: "Email must be a valid email address"
          x-oapi-codegen-extra-tags:
            validate: "required,email,min=5,max=255"
        password:
          type: string
          format: password
          description: "Password must contain at least 8 characters and can only include Latin letters (A-Z, a-z), digits (0-9), and special characters (@, $, !, %, *, ?, &)"
          pattern: "^[A-Za-z\\d@$!%*?&]{8,}$"
          x-oapi-codegen-extra-tags:
            validate: "required,min=8,max=255,password_regexp"
      required:
        - email
        - password
    LoginResponseWeb:
      type: object
      description: "Token response for web clients. Additional fields can be included in the response"
      properties:
        id:
          type: string
          description: "User ID"
        access_token:
          type: string
          description: "Access token"
      additionalProperties: true
    LoginResponseMobile:
      type: object
      description: "Token response for mobile clients. Additional fields can be included in the response"
      properties:
        id:
          type: string
          description: "User ID"
        access_token:
          type: string
          description: "Access token"
        refresh_token:
          type: string
          description: "Refresh token"
      additionalProperties: true
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          description: "Email must be a valid email address"
          x-oapi-codegen-extra-tags:
            validate: "required,email,min=5,max=255"
        password:
          type: string
          format: password
          description: "Password must contain at least 8 characters and can only include Latin letters (A-Z, a-z), digits (0-9), and special characters (@, $, !, %, *, ?, &)"
          pattern: "^[A-Za-z\\d@$!%*?&]{8,}$"
          x-oapi-codegen-extra-tags:
            validate: "required,min=8,max=255,password_regexp"
        name:
          type: string
          description: "Name must be a string between 1 and 255 characters"
          x-oapi-codegen-extra-tags:
            validate: "required,min=1,max=255"
      required:
        - email
        - password
        - name
    RegisterResponseWeb:
      type: object
      description: "User data and token response for web clients. Additional fields can be included in the response"
      properties:
        id:
          type: string
          description: "User ID"
        name:
          type: string
          description: "User name"
        email:
          type: string
          description: "User email"
        access_token:
          type: string
          description: "Access token"
      additionalProperties: true
    RegisterResponseMobile:
      type: object
      description: "User data and token response for mobile clients. Additional fields can be included in the response"
      properties:
        id:
          type: string
          description: "User ID"
        name:
          type: string
          description: "User name"
        email:
          type: string
          description: "User email"
        access_token:
          type: string
          description: "Access token"
        refresh_token:
          type: string
          description: "Refresh token"
      additionalProperties: true
    RefreshTokenRequestMobile:
      type: object
      properties:
        refresh_token:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
      required:
        - refresh_token
    RefreshTokenResponseWeb:
      type: object
      description: "Token response for web clients. Additional fields can be included in the response"
      properties:
        access_token:
          type: string
          description: "Access token"
      additionalProperties: true
    RefreshTokenResponseMobile:
      type: object
      description: "Token response for mobile clients. Additional fields can be included in the response"
      properties:
        access_token:
          type: string
          description: "Access token"
        refresh_token:
          type: string
          description: "Refresh token"
      additionalProperties: true
    UpdateOwnProfileRequest:
      type: object
      properties:
        name:
          type: string
          description: "Name (optional) must be a string between 1 and 255 characters"
          x-oapi-codegen-extra-tags:
            validate: "min=1,max=255"
        email:
          type: string
          description: "Email (optional) must be a valid email address"
          x-oapi-codegen-extra-tags:
